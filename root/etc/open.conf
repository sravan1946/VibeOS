# File associations, used by Files, the desktop and `open FILE`.
#   extension,extension,...   program[|fallback|fallback]     (first program that exists wins; the file is its argument)
# A file with no matching extension runs itself if it is executable; otherwise the "*" line applies.
txt,md,log,conf,cfg,ini,csv,rtf          /bin/notepad
c,h,cc,cpp,hpp,lua,py,js,sh,mk,asm,s,css,json,xml,yml,yaml,toml   /bin/code
png,jpg,jpeg,gif,bmp,ppm,pgm             /bin/viewer
wav,mp3,ogg,flac,aac                     /bin/music|/bin/play
mid,midi                                 /bin/midi
html,htm,xhtml                           /bin/browser
*                                        /bin/notepad
