<!doctype html>
<html><head><title>Layout 2: regressions from real sites</title>
<style>
body { margin: 8px; font-family: sans-serif; font-size: 14px; }
.t { margin: 0 0 10px; border: 1px solid #888; }
/* abs-positioned control (ddg search button) */
.srch { position: relative; height: 40px; padding-right: 6em; box-sizing: border-box; background: #fff; }
.srch input[type=text] { display: block; width: 100%; border: 0; height: 30px; }
.srch input[type=submit] { position: absolute; top: 0; bottom: 0; right: 2px; left: auto; margin: auto; width: 1em; padding: 0 .6em; }
.fx { display: flex; border: 1px solid #a9a9a9; align-items: stretch; }
.fx input[type=search] { border: 0; padding-left: 24px; width: 100%; flex: 1; }
.fx input[type=submit] { height: 100%; border: 0; }
.nav { position: sticky; top: 0; padding: 10px 0; color: #fff; }
.nav::after { position: absolute; inset: 0; z-index: -1; display: block; content: ""; background-image: linear-gradient(rgb(112,44,249), rgba(112,44,249,.8)); }
</style></head><body>
<div class="t"><form class="srch"><input type="text"><input type="submit" value=""></form></div>
<!-- flex form: controls are flex items (blockified, flex:1 beats width:100%) -->
<div class="t" style="width:400px"><form class="fx">
<input type="search"><input type="submit" value="Go"></form></div>
<!-- grid: minmax(15rem,1fr) keeps its minimum, minmax(0,48rem) is capped by the room left -->
<div class="t" style="display:grid;grid-template-columns:minmax(15rem,1fr) 2rem minmax(0,48rem) minmax(0,1fr)"><div style="background:#fcc">side</div><div></div><div style="background:#cfc">content</div><div></div></div>
<!-- position: sticky is a containing block (its ::after fills it) and a gradient background is painted -->
<div class="t" style="height:90px"><header class="nav">navbar</header><p>below the sticky header</p></div>
<!-- grid: repeat(4, minmax(0, 25%)) with gaps shrinks to fit instead of overflowing -->
<div class="t" style="display:grid;gap:18px;grid-template-columns:repeat(4,minmax(0,25%))"><div>a</div><div>b</div><div>c</div><div>d</div></div>
<!-- icon-font text (Material ligature names) is not laid out; clip: rect(0 0 0 0) hides skip links; box-shadow stays outside a transparent box -->
<div class="t" style="box-shadow:0 1px #c8ccd1"><a style="position:absolute;clip:rect(0 0 0 0);overflow:hidden">Skip to content</a>Menu <i style="font-family:'Material Icons'">arrow_drop_down</i> end</div>
<!-- flex/grid items that are plain inline elements are blockified (gap applies); a nowrap inline (sup.reference) wraps with the word before it, never under a float -->
<div class="t" style="display:flex;gap:24px"><a>Docs</a><a>Play</a><span>Blog</span></div>
<div class="t" style="width:200px"><div style="float:right;width:120px;height:40px;background:#ccc"></div>one two three four five six seven eight hardware,<sup style="white-space:nowrap"><a href="#">[2][3]</a></sup> after</div>
<!-- grid: named lines ([x-start]/[x-end]) place items via grid-column: x / grid-row: x / grid-area: x -->
<div class="t" style="display:grid;gap:10px;grid-template-columns:[l] 0px [content-start] repeat(3,minmax(0,1fr)) [content-end] 0px;grid-template-rows:[head-start] auto [head-end body-start] auto [body-end]"><div style="grid-column:content;grid-row:head">wide head</div><div style="grid-area:body">b</div></div>
<!-- a floated / shrink-to-fit grid is as wide as its columns together (icon + LIVE label), not its widest item -->
<div class="t"><div style="float:left;display:grid;grid-template-columns:auto auto;gap:3px"><i style="width:20px;height:20px;display:block"></i><span>LIVE</span></div><b>headline text</b></div>
<!-- flex: items with equal order stay in document order even when an anonymous text item was created later -->
<div class="t" style="display:flex;white-space:pre"><span>one </span>two <span>three</span></div>
<!-- flex: automatic minimum size is min-content even when flex-basis is 0 (flex:1 beside a 130px media box); grid auto-fit with a % minimum caps at the item count -->
<div class="t" style="display:flex;gap:12px;width:260px"><a style="display:flex;flex:1"><div style="width:130px;height:30px;background:#ccc"></div></a><a style="display:flex"><span>The retired ocean liner is sunk</span></a></div>
<div class="t" style="display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(25%,1fr))"><div>a</div><div>b</div><div>c</div></div>
<!-- grid tracks: newlines inside repeat(), calc() with % and px -->
<div class="t" style="display:grid;gap:20px;grid-template-columns:repeat(
  4,calc(
    (25%) -
      15px
  )
)"><div>a</div><div>b</div><div>c</div><div>d</div></div>
</body></html>
