<!doctype html><html><body style="margin:10px;background:#fff">
<div style="display:flex;flex-wrap:wrap;gap:10px">
<div style="width:180px;height:100px;background:linear-gradient(45deg,#f00,#00f)"></div>
<div style="width:180px;height:100px;background:linear-gradient(to bottom right,#fc0,#0cf 60%,#fff)"></div>
<div style="width:180px;height:100px;border-radius:30px;background:linear-gradient(#f06,#60f)"></div>
<div style="width:180px;height:100px;background:radial-gradient(circle at 30% 40%,#ff0,#f00 50%,#000)"></div>
<div style="width:180px;height:100px;background:radial-gradient(ellipse at top,#0f0,transparent 70%)"></div>
<div style="width:100px;height:100px;border-radius:50%;background:conic-gradient(from 90deg,red,yellow,lime,aqua,blue,magenta,red)"></div>
<div style="width:180px;height:100px;background:linear-gradient(to right,#000,#fff)"></div>
</div></body></html>
