        check('XMLHttpRequest', [x.status, x.responseText.includes('boot'), st.join()], [200, true, '1,2,3,4']);
        const xs = new XMLHttpRequest(); xs.open('GET', 'todo.txt', false); xs.send();
        check('XMLHttpRequest sync', [xs.status, xs.responseText.length > 10], [200, true]);
        const r2 = await fetch('todo.txt', { signal: AbortSignal.timeout(5000) });
        check('fetch headers/url', [r2.headers.get('content-type') !== undefined, r2.url.endsWith('todo.txt')], [true, true]);
        const ac = new AbortController(); ac.abort();
        check('fetch abort', await fetch('todo.txt', { signal: ac.signal }).then(() => 'ok', e => e.name), 'AbortError');
        check('fetch data: URL', await (await fetch('data:text/plain;base64,aGk=')).text(), 'hi');
    }
    localStorage.setItem('k2', 'v2'); localStorage.foo = 'bar';
    check('localStorage proxy', [localStorage.k2, localStorage.getItem('foo'), localStorage.length >= 3, Object.keys(localStorage).includes('k2')], ['v2', 'bar', true, true]);
    localStorage.clear();
    check('Promise combinators', [await Promise.all([1, Promise.resolve(2)]), (await Promise.allSettled([Promise.reject(1)]))[0].status, await Promise.race([new Promise(r => setTimeout(() => r('slow'), 30)), 'fast'])], [[1, 2], 'rejected', 'fast']);
    const s = document.getElementById('summary');
    s.textContent = fail ? `${pass} passed, ${fail} FAILED` : `all ${pass} tests passed`;
    s.className = fail ? 'fail' : 'pass';
    console.log('jstest:', pass, 'passed,', fail, 'failed');
})();
